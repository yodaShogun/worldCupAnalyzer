name: World Cup Data Pipeline

on:
  schedule:
    - cron: '0 6  * * *'   # morning baseline
    - cron: '0 17 * * *'   # after afternoon matches
    - cron: '0 21 * * *'   # after evening matches
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r python_pipeline/requirements.txt

      - name: Run pipeline
        working-directory: python_pipeline   # 👈 this is the only thing that matters
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main.py

      - name: Revalidate Vercel pages
        run: |
          curl -X POST "${{ secrets.VERCEL_URL }}/api/revalidate" \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"paths": ["/", "/groups", "/stats"]}'
